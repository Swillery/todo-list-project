<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Listifier</title>
</head>
<body>

    <div id="content">
        <aside id="projectSidebar">
            <!-- the add project button is inside the sidebar -->
            <!-- it will be re-rendered dynamically in js, but okay to keep here initially -->
            <button id="addProjectBtn">+ Add Project</button>
        </aside>
        <main id="todoContainer"></main>
    </div>

    <!-- project modal, outside of sidebar so it is never removed -->
    <div id="projectModal">
        <form id="projectForm">
            <h2>New Project</h2>
            <input type="text" id="projectName" placeholder="Project Name" required />
        </form>
    </div>

    <!-- floating add task button -->
    <button id="addTaskBtn">+</button>

    <div id="todoDetailsModal">
        <div id="todoDetailsContent"></div>
    </div>

    <!-- todo modal, also outside sidebar -->
    <div id="todoModal">
        <form id="todoForm">
            <h2>New Task</h2>
            <input type="text" id="todoTitle" placeholder="Task name" required />
            <textarea id="todoDesc" placeholder="Description"></textarea>
            <input type="date" id="todoDate" />
            <select id="todoProject">
                <!-- dynamically populated from js -->
            </select>
            <select id="todoPriority">
                <option value="green">Low</option>
                <option value="yellow">Medium</option>
                <option value="red">High</option>
            </select>
            <button type="submit">Add Task</button>
        </form>
    </div>

</body>
</html>
